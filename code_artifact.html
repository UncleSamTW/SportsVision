<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隨機顏色切換器</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
    }

    /* 超大圓燈未點亮（休眠）狀態質感 */
    .lamp-dormant {
      background: radial-gradient(circle at 35% 30%, #27272a 0%, #18181b 55%, #09090b 100%);
      box-shadow: 
        inset 0 10px 25px rgba(0, 0, 0, 0.9),
        inset 0 -8px 20px rgba(255, 255, 255, 0.04),
        0 8px 30px rgba(0, 0, 0, 0.6);
      border-color: #27272a;
    }

    /* 紅燈發光狀態 */
    .lamp-red {
      background: radial-gradient(circle at 38% 32%, #fca5a5 0%, #ef4444 42%, #b91c1c 78%, #7f1d1d 100%);
      box-shadow: 
        0 0 70px rgba(239, 68, 68, 0.8),
        0 0 130px rgba(239, 68, 68, 0.45),
        inset 0 0 35px rgba(255, 255, 255, 0.75),
        inset 0 -12px 30px rgba(127, 29, 29, 0.8);
      border-color: #fca5a5;
    }

    /* 黃燈發光狀態 */
    .lamp-yellow {
      background: radial-gradient(circle at 38% 32%, #fef08a 0%, #facc15 42%, #eab308 75%, #a16207 100%);
      box-shadow: 
        0 0 70px rgba(250, 204, 21, 0.85),
        0 0 130px rgba(234, 179, 8, 0.45),
        inset 0 0 35px rgba(255, 255, 255, 0.8),
        inset 0 -12px 30px rgba(161, 98, 7, 0.8);
      border-color: #fef08a;
    }

    /* 綠燈發光狀態 */
    .lamp-green {
      background: radial-gradient(circle at 38% 32%, #86efac 0%, #22c55e 42%, #15803d 78%, #14532d 100%);
      box-shadow: 
        0 0 70px rgba(34, 197, 94, 0.85),
        0 0 130px rgba(34, 197, 94, 0.45),
        inset 0 0 35px rgba(255, 255, 255, 0.75),
        inset 0 -12px 30px rgba(20, 83, 45, 0.8);
      border-color: #86efac;
    }
  </style>
</head>
<body class="bg-[#080b11] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

  <!-- 頂部精簡導覽列 -->
  <header class="border-b border-slate-800/60 bg-slate-900/40 backdrop-blur-md px-4 py-3 sm:px-8">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-2.5 h-2.5 rounded-full bg-indigo-500 shadow-[0_0_8px_#6366f1]"></div>
        <h1 class="text-sm sm:text-base font-bold tracking-wider text-slate-200">隨機顏色切換器</h1>
      </div>

      <div class="hidden sm:flex items-center gap-1.5 text-slate-500 bg-slate-900/90 border border-slate-800 px-3 py-1 rounded-lg text-xs">
        <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono">Space</kbd>
        <span>啟動 / 停止</span>
      </div>
    </div>
  </header>

  <!-- 主視覺卡片區 -->
  <main class="max-w-xl w-full mx-auto p-4 sm:p-6 flex-1 flex flex-col justify-center items-center">
    
    <div class="w-full bg-gradient-to-b from-slate-900/80 to-slate-950/90 border border-slate-800/80 rounded-3xl p-6 sm:p-9 shadow-2xl relative overflow-hidden backdrop-blur-xl flex flex-col items-center">
      
      <!-- 動態全域背景微光 -->
      <div id="ambientBackdrop" class="absolute inset-0 opacity-20 transition-all duration-700 pointer-events-none"></div>

      <!-- 狀態小標 -->
      <div class="flex items-center justify-between w-full mb-6 z-10">
        <div class="flex items-center space-x-2">
          <span id="statusIndicatorBadge" class="relative flex h-3 w-3">
            <span id="statusPing" class="hidden animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span id="statusDot" class="relative inline-flex rounded-full h-3 w-3 bg-slate-600"></span>
          </span>
          <span id="statusLabel" class="text-xs sm:text-sm font-semibold tracking-wider text-slate-400 uppercase">等待開始</span>
        </div>
        <div id="statusSubText" class="text-xs text-slate-500">
          設定 N 秒後按開始
        </div>
      </div>

      <!-- 核心：超大單一指示燈 (Large Single Light Display) -->
      <div class="relative p-5 sm:p-6 rounded-full bg-gradient-to-b from-slate-800/80 via-slate-900/90 to-slate-950 border border-slate-700/60 shadow-[0_15px_40px_rgba(0,0,0,0.8),inset_0_2px_4px_rgba(255,255,255,0.1)] z-10 my-2">
        
        <!-- 外圈金屬倒角襯墊 -->
        <div class="p-3 sm:p-3.5 rounded-full bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 border border-slate-800/90 shadow-inner">
          
          <!-- 大燈本體 -->
          <div id="bigLamp" class="lamp-dormant w-48 h-48 sm:w-60 sm:h-60 rounded-full border-4 transition-all duration-500 relative flex items-center justify-center overflow-hidden cursor-pointer group" title="點擊也可立即隨機換色">
            
            <!-- 上半部弧形玻璃高光反射層 -->
            <div class="absolute top-2 left-6 right-6 h-1/2 rounded-t-full bg-gradient-to-b from-white/35 to-transparent pointer-events-none blur-[1px]"></div>
            
            <!-- 斜角微光亮斑 -->
            <div class="absolute top-6 left-8 w-12 h-6 sm:w-16 sm:h-8 rounded-full bg-white/40 rotate-[-28deg] blur-[2px] pointer-events-none"></div>

            <!-- 下方柔和環境反光 -->
            <div class="absolute bottom-3 inset-x-8 h-8 rounded-full bg-white/10 blur-md pointer-events-none"></div>
          </div>

        </div>
      </div>

      <!-- 當前顏色文字提示 -->
      <div class="mt-5 text-center z-10">
        <div class="text-[11px] uppercase tracking-widest text-slate-500 mb-1 font-semibold">當前顏色</div>
        <div id="activeColorName" class="text-3xl sm:text-4xl font-extrabold text-slate-400 tracking-wider transition-colors duration-300">
          休眠中
        </div>
      </div>

      <!-- 平滑倒數計時進度條 -->
      <div class="w-full mt-6 z-10 max-w-sm">
        <div class="flex justify-between items-center text-xs text-slate-400 mb-2">
          <span class="flex items-center gap-1.5"><i data-lucide="timer" class="w-3.5 h-3.5 text-slate-400"></i> 下次切換倒數</span>
          <span id="countdownText" class="font-mono font-semibold text-slate-200">-- 秒</span>
        </div>
        <div class="w-full h-2 bg-slate-950/80 rounded-full overflow-hidden border border-slate-800 shadow-inner p-0.5">
          <div id="countdownProgressBar" class="h-full bg-slate-700 rounded-full transition-all duration-75 ease-linear w-0"></div>
        </div>
      </div>

      <!-- 控制面板與輸入區 -->
      <div class="w-full max-w-sm mt-7 pt-6 border-t border-slate-800/80 z-10 space-y-4">
        
        <!-- N 秒輸入欄位與快捷設定 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="intervalInput" class="text-xs font-semibold text-slate-300">
              每 N 秒切換一次
            </label>
            <div class="space-x-1.5 text-xs text-slate-500">
              <span>快捷:</span>
              <button type="button" class="quick-preset hover:text-indigo-400 underline decoration-dotted" data-val="1">1s</button>
              <button type="button" class="quick-preset hover:text-indigo-400 underline decoration-dotted" data-val="2">2s</button>
              <button type="button" class="quick-preset hover:text-indigo-400 underline decoration-dotted" data-val="3">3s</button>
              <button type="button" class="quick-preset hover:text-indigo-400 underline decoration-dotted" data-val="5">5s</button>
            </div>
          </div>

          <div class="relative flex items-center">
            <input 
              type="number" 
              id="intervalInput" 
              min="0.2" 
              max="60" 
              step="0.5" 
              value="2.0" 
              class="w-full rounded-xl bg-slate-950/90 border border-slate-700/80 px-4 py-3 text-slate-100 placeholder-slate-500 font-mono text-base focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 transition-all"
              placeholder="請輸入 N 秒 (例如: 1.5, 2)"
            />
            <span class="absolute right-4 text-xs text-slate-400 font-medium pointer-events-none">秒</span>
          </div>
        </div>

        <!-- 錯誤提示訊息 -->
        <div id="noticeBox" class="hidden p-2.5 rounded-xl bg-rose-950/60 border border-rose-800/80 text-rose-300 text-xs flex items-center gap-2">
          <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
          <span id="noticeMessage">請輸入有效的秒數</span>
        </div>

        <!-- 按鈕操作群組 -->
        <div class="flex gap-3 pt-1">
          <!-- 開始 / 停止切換按鈕 -->
          <button 
            id="mainActionBtn" 
            class="flex-1 flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-bold text-sm shadow-lg shadow-indigo-600/30 transition-all duration-200">
            <i data-lucide="play" class="w-4 h-4 fill-current" id="btnIcon"></i>
            <span id="btnText">開始</span>
          </button>

          <!-- 立即手動換色按鈕 -->
          <button 
            id="manualNextBtn" 
            title="立即隨機切換顏色"
            class="flex items-center justify-center gap-1.5 px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-[0.98] text-slate-200 border border-slate-700 transition-all duration-200 text-sm font-semibold">
            <i data-lucide="shuffle" class="w-4 h-4"></i>
            <span class="hidden sm:inline">立即換色</span>
          </button>
        </div>

      </div>

    </div>

  </main>

  <!-- 頁尾 -->
  <footer class="py-4 text-center text-xs text-slate-600 border-t border-slate-900">
    <p>隨機顏色切換器 &bull; 單顆大指示燈簡約版</p>
  </footer>

  <script>
    /**
     * 三種顏色定義與樣式
     */
    const COLORS = [
      { id: 'green', name: '綠燈', textClass: 'text-emerald-400', lampClass: 'lamp-green', bgHex: '#22c55e', barClass: 'bg-emerald-500' },
      { id: 'yellow', name: '黃燈', textClass: 'text-amber-400', lampClass: 'lamp-yellow', bgHex: '#eab308', barClass: 'bg-yellow-400' },
      { id: 'red', name: '紅燈', textClass: 'text-red-500', lampClass: 'lamp-red', bgHex: '#ef4444', barClass: 'bg-red-500' }
    ];

    let isRunning = false;
    let intervalSeconds = 2.0;
    let currentColor = null;

    // 動畫計時變數
    let startTime = 0;
    let targetDurationMs = 2000;
    let animationFrameId = null;

    // DOM 快取
    const bigLamp = document.getElementById('bigLamp');
    const intervalInput = document.getElementById('intervalInput');
    const mainActionBtn = document.getElementById('mainActionBtn');
    const manualNextBtn = document.getElementById('manualNextBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const statusLabel = document.getElementById('statusLabel');
    const statusPing = document.getElementById('statusPing');
    const statusDot = document.getElementById('statusDot');
    const statusSubText = document.getElementById('statusSubText');
    const activeColorName = document.getElementById('activeColorName');
    const countdownText = document.getElementById('countdownText');
    const countdownProgressBar = document.getElementById('countdownProgressBar');
    const noticeBox = document.getElementById('noticeBox');
    const noticeMessage = document.getElementById('noticeMessage');
    const ambientBackdrop = document.getElementById('ambientBackdrop');

    /**
     * 驗證輸入秒數
     */
    function getValidatedInterval() {
      const val = parseFloat(intervalInput.value);
      if (isNaN(val) || val <= 0.1) {
        showNotice('請輸入大於或等於 0.2 的秒數！');
        return null;
      }
      if (val > 3600) {
        showNotice('秒數設定過大，請輸入小於 3600 秒的數值。');
        return null;
      }
      hideNotice();
      return Math.round(val * 10) / 10;
    }

    function showNotice(msg) {
      noticeMessage.textContent = msg;
      noticeBox.classList.remove('hidden');
    }

    function hideNotice() {
      noticeBox.classList.add('hidden');
    }

    /**
     * 隨機切換顏色
     */
    function triggerRandomColor() {
      const randomIndex = Math.floor(Math.random() * COLORS.length);
      const chosen = COLORS[randomIndex];
      currentColor = chosen;

      // 更新單一大燈與介面狀態
      updateBigLampUI(chosen);

      // 若在運行狀態中，重設計時基準點
      if (isRunning) {
        startTime = performance.now();
        targetDurationMs = intervalSeconds * 1000;
      }
    }

    /**
     * 更新大燈視覺效果與霓虹微光
     */
    function updateBigLampUI(color) {
      // 移除休眠與其他燈色樣式
      bigLamp.classList.remove('lamp-dormant', 'lamp-red', 'lamp-yellow', 'lamp-green');
      bigLamp.classList.add(color.lampClass);

      // 更新文字提示
      activeColorName.textContent = color.name;
      activeColorName.className = `text-3xl sm:text-4xl font-extrabold tracking-wider transition-colors duration-300 ${color.textClass}`;

      // 全域環境光
      ambientBackdrop.style.background = `radial-gradient(circle at center, ${color.bgHex}40 0%, transparent 65%)`;

      // 同步倒數進度條顏色
      countdownProgressBar.className = `h-full rounded-full transition-all duration-75 ease-linear ${color.barClass}`;
    }

    /**
     * 休眠燈號顯示
     */
    function resetToDormant() {
      bigLamp.classList.remove('lamp-red', 'lamp-yellow', 'lamp-green');
      bigLamp.classList.add('lamp-dormant');
      ambientBackdrop.style.background = 'none';
      activeColorName.textContent = '休眠中';
      activeColorName.className = 'text-3xl sm:text-4xl font-extrabold tracking-wider text-slate-400 transition-colors duration-300';
    }

    /**
     * 平滑倒數計時器循環 (requestAnimationFrame)
     */
    function countdownLoop(timestamp) {
      if (!isRunning) return;

      const elapsed = timestamp - startTime;
      const remainingMs = Math.max(0, targetDurationMs - elapsed);
      const remainingSec = (remainingMs / 1000).toFixed(1);

      countdownText.textContent = `${remainingSec} 秒`;

      const progressPercent = Math.min(100, (elapsed / targetDurationMs) * 100);
      countdownProgressBar.style.width = `${progressPercent}%`;

      // 倒數結束，切換下一組隨機顏色
      if (elapsed >= targetDurationMs) {
        triggerRandomColor();
      }

      animationFrameId = requestAnimationFrame(countdownLoop);
    }

    /**
     * 開始運作
     */
    function start() {
      const validVal = getValidatedInterval();
      if (!validVal) return;

      intervalSeconds = validVal;
      isRunning = true;

      // 按鈕樣式轉為停止 (紅色)
      mainActionBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/30');
      mainActionBtn.classList.add('bg-rose-600', 'hover:bg-rose-500', 'shadow-rose-600/30');
      btnText.textContent = '停止';
      btnIcon.setAttribute('data-lucide', 'square');
      lucide.createIcons();

      // 頂部狀態列
      statusLabel.textContent = '運作中 (自動切換)';
      statusLabel.className = 'text-xs sm:text-sm font-semibold tracking-wider text-emerald-400 uppercase';
      statusPing.classList.remove('hidden');
      statusDot.className = 'relative inline-flex rounded-full h-3 w-3 bg-emerald-500';
      statusSubText.textContent = `每 ${intervalSeconds} 秒切換一次`;

      // 鎖定輸入欄
      intervalInput.disabled = true;
      intervalInput.classList.add('opacity-60', 'cursor-not-allowed');

      // 立即隨機點亮一個顏色，並啟動倒數計時
      triggerRandomColor();
      startTime = performance.now();
      targetDurationMs = intervalSeconds * 1000;
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(countdownLoop);
    }

    /**
     * 停止運作
     */
    function stop() {
      isRunning = false;
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      // 按鈕樣式還原 (Indigo)
      mainActionBtn.classList.remove('bg-rose-600', 'hover:bg-rose-500', 'shadow-rose-600/30');
      mainActionBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-500', 'shadow-indigo-600/30');
      btnText.textContent = '開始';
      btnIcon.setAttribute('data-lucide', 'play');
      lucide.createIcons();

      // 狀態文字
      statusLabel.textContent = '已暫停';
      statusLabel.className = 'text-xs sm:text-sm font-semibold tracking-wider text-slate-400 uppercase';
      statusPing.classList.add('hidden');
      statusDot.className = 'relative inline-flex rounded-full h-3 w-3 bg-slate-600';
      statusSubText.textContent = '已停止自動切換';

      // 解鎖輸入欄
      intervalInput.disabled = false;
      intervalInput.classList.remove('opacity-60', 'cursor-not-allowed');

      countdownText.textContent = '已暫停';
      countdownProgressBar.style.width = '0%';
    }

    /**
     * 事件監聽
     */
    mainActionBtn.addEventListener('click', () => {
      if (isRunning) {
        stop();
      } else {
        start();
      }
    });

    manualNextBtn.addEventListener('click', () => {
      triggerRandomColor();
    });

    // 點擊大燈本身也可以直接隨機換色
    bigLamp.addEventListener('click', () => {
      triggerRandomColor();
    });

    // 快速秒數選擇
    document.querySelectorAll('.quick-preset').forEach(btn => {
      btn.addEventListener('click', (e) => {
        if (isRunning) return;
        const val = e.target.getAttribute('data-val');
        intervalInput.value = val;
        hideNotice();
      });
    });

    intervalInput.addEventListener('input', () => {
      getValidatedInterval();
    });

    // 鍵盤空白鍵 (Space) 或 Enter 啟動 / 暫停
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === intervalInput && e.key !== 'Enter') return;

      if (e.code === 'Space' || e.key === 'Enter') {
        e.preventDefault();
        if (isRunning) {
          stop();
        } else {
          start();
        }
      }
    });

    // 初始化 Lucide 圖示
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
